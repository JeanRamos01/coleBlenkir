# Perfil de práctica: H2 en archivo, persistente entre reinicios.
# Ejecutar: mvn spring-boot:run -Dspring-boot.run.profiles=practica
spring.datasource.url=jdbc:h2:file:./seguimiento_academico;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never
blenkir.consola.activa=false
