spring.application.name=blenkir
server.port=${PORT:8080}

# ---- PostgreSQL (puedes cambiarlo con variables de entorno) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blenkir}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# ---- El esquema lo controla schema.sql (idempotente), Hibernate no toca las tablas ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---- Consola interactiva (Scanner). Pon false para desactivarla ----
blenkir.consola.activa=${CONSOLA:true}

# ---- Logs reducidos para que el menú de consola se lea bien ----
logging.level.root=WARN
logging.level.pe.blenkir=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
spring.main.banner-mode=console
spring.banner.location=classpath:banner.txt
